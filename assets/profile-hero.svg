<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">Ahmed Hassan — Software Engineer</title>
  <desc id="description">Animated developer profile banner with a terminal prompt and orbiting code symbol.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="0.58" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25304a"/>
      <stop offset="0.48" stop-color="#2f6bff"/>
      <stop offset="0.72" stop-color="#b8f116"/>
      <stop offset="1" stop-color="#25304a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2f6bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="terminalLineOne"><rect class="type-one" x="754" y="360" width="342" height="22"/></clipPath>
    <clipPath id="terminalLineTwo"><rect class="type-two" x="754" y="389" width="315" height="22"/></clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #8d98ad; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .draw { stroke-dasharray: 460; stroke-dashoffset: 460; animation: draw 2.8s cubic-bezier(.4,0,.2,1) .3s forwards; }
      .orbit { transform-origin: 930px 211px; animation: orbit 18s linear infinite; }
      .orbit-reverse { transform-origin: 930px 211px; animation: orbit-reverse 12s linear infinite; }
      .node { animation: node-pulse 2.8s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1,end) infinite; }
      .scan { animation: scan 7s ease-in-out infinite; }
      .code { animation: code-breathe 3.2s ease-in-out infinite; }
      .type-one, .type-two { transform-box: fill-box; transform-origin: left center; }
      .type-one { animation: type-one 5s steps(34,end) infinite; }
      .type-two { animation: type-two 5s steps(35,end) infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
      @keyframes node-pulse { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
      @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
      @keyframes scan { 0%,18% { transform: translateY(-90px); opacity: 0; } 32%,68% { opacity: .7; } 82%,100% { transform: translateY(470px); opacity: 0; } }
      @keyframes code-breathe { 0%,100% { opacity: .74; } 50% { opacity: 1; } }
      @keyframes type-one { 0% { transform: scaleX(0); } 42%,100% { transform: scaleX(1); } }
      @keyframes type-two { 0%,48% { transform: scaleX(0); } 86%,100% { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .draw { stroke-dashoffset: 0; }
        .orbit, .orbit-reverse, .node, .cursor, .scan, .code, .type-one, .type-two { animation: none; }
        .type-one, .type-two { transform: scaleX(1); }
        .scan { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="470" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="468" rx="27" fill="none" stroke="#29334a" stroke-width="2"/>
  <path d="M28 1h1144" stroke="url(#edge)" stroke-width="2"/>

  <g opacity="0.56">
    <path d="M42 77H593M42 413H1158" stroke="#1b2538"/>
    <path d="M674 42V428" stroke="#1b2538"/>
    <circle cx="42" cy="77" r="3" fill="#2f6bff"/>
    <circle cx="1158" cy="413" r="3" fill="#b8f116"/>
  </g>

  <g class="sans">
    <g transform="translate(56 45)">
      <rect width="46" height="46" rx="13" fill="#b8f116"/>
      <text x="23" y="30" text-anchor="middle" fill="#07100d" font-size="17" font-weight="800" letter-spacing="-1">AH</text>
      <text x="61" y="19" fill="#f5f7fb" font-size="14" font-weight="700">Ahmed Hassan</text>
      <text x="61" y="39" class="mono muted" font-size="11">software engineer</text>
    </g>

    <text x="57" y="173" fill="#f5f7fb" font-size="66" font-weight="760" letter-spacing="-3">Ahmed Hassan</text>
    <text x="59" y="220" fill="#2f6bff" font-size="30" font-weight="680" letter-spacing="0.6">Software Engineer</text>
    <path class="line draw" d="M59 243H587" stroke="#2f6bff" stroke-width="2"/>
    <circle cx="590" cy="243" r="5" fill="#b8f116" filter="url(#softGlow)"/>

    <text x="59" y="290" fill="#dce2ec" font-size="21" font-weight="470">I build reliable web platforms and</text>
    <text x="59" y="320" fill="#dce2ec" font-size="21" font-weight="470">performance-minded systems.</text>

    <g transform="translate(59 353)">
      <path d="M8 0a8 8 0 0 0-8 8c0 6 8 14 8 14s8-8 8-14a8 8 0 0 0-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z" fill="#b8f116"/>
      <text x="28" y="16" class="mono muted" font-size="15">Sialkot, Pakistan</text>
    </g>

    <g class="mono" transform="translate(59 401)">
      <text fill="#b8f116" font-size="14">&gt;_</text>
      <text x="37" fill="#8793a8" font-size="14">build</text>
      <text x="85" fill="#4d5a72" font-size="14">/</text>
      <text x="102" fill="#8793a8" font-size="14">optimize</text>
      <text x="179" fill="#4d5a72" font-size="14">/</text>
      <text x="196" fill="#8793a8" font-size="14">ship</text>
      <rect class="cursor" x="236" y="-13" width="8" height="17" rx="1" fill="#b8f116"/>
    </g>
  </g>

  <g>
    <circle cx="930" cy="211" r="142" fill="none" stroke="#2a3449" stroke-width="1.4" stroke-dasharray="5 8"/>
    <circle cx="930" cy="211" r="84" fill="none" stroke="#202c43" stroke-width="1.2" stroke-dasharray="3 7"/>
    <g class="orbit">
      <ellipse cx="930" cy="211" rx="132" ry="62" fill="none" stroke="#b8f116" stroke-width="1.8" stroke-dasharray="7 6"/>
      <g class="node" filter="url(#softGlow)">
        <circle cx="1062" cy="211" r="12" fill="#07100d" stroke="#b8f116" stroke-width="2"/>
        <circle cx="1062" cy="211" r="5" fill="#b8f116"/>
      </g>
    </g>
    <g class="orbit-reverse">
      <circle cx="930" cy="69" r="5" fill="#2f6bff"/>
      <circle cx="930" cy="69" r="12" fill="none" stroke="#2f6bff" stroke-opacity="0.42"/>
    </g>

    <g class="code mono" text-anchor="middle" font-weight="800" filter="url(#softGlow)">
      <text x="930" y="226" fill="#2f6bff" font-size="52" letter-spacing="-5">&lt;/&gt;</text>
    </g>

    <g transform="translate(727 329)">
      <rect width="407" height="93" rx="14" fill="#0a101c" stroke="#2b354a"/>
      <circle cx="22" cy="21" r="4" fill="#b8f116"/>
      <circle cx="37" cy="21" r="4" fill="#2f6bff"/>
      <circle cx="52" cy="21" r="4" fill="#536078"/>
      <path d="M0 41H407" stroke="#202a3d"/>
    </g>
    <g class="mono" font-size="13">
      <text x="748" y="375" fill="#b8f116">$</text>
      <text x="768" y="375" fill="#c5ccd8" clip-path="url(#terminalLineOne)">engineer --build --optimize --ship</text>
      <text x="748" y="404" fill="#2f6bff">›</text>
      <text x="768" y="404" fill="#8793a8" clip-path="url(#terminalLineTwo)">solving problems with thoughtful code</text>
      <rect class="cursor" x="1078" y="389" width="7" height="17" rx="1" fill="#b8f116"/>
    </g>
  </g>

  <rect class="scan" x="2" y="-84" width="1196" height="84" rx="26" fill="url(#scan)" pointer-events="none"/>
</svg>
